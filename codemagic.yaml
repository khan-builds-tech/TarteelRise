# Codemagic CI/CD Pipeline Configuration for Tarteel Rise (Android Sandbox Workflow)
workflows:
  android-build:
    name: Tarteel Rise Android Sandbox Installer
    max_build_duration: 20
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'develop'
          include: true
    scripts:
      - name: Fetch Core Dependencies
        script: | 
          flutter pub get
      - name: Verify Audio Asset Workspace
        script: |
          mkdir -p assets/audio
          if [ ! -f assets/audio/adhan.mp3 ]; then
            echo "Mock Audio Track Data" > assets/audio/adhan.mp3
          fi
      - name: Build Debug Android Application Package
        script: | 
          # Generates a universal APK package ready for direct installation on any device
          flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - aman2810@example.com # Replace with your email address
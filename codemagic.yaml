# Codemagic CI/CD Pipeline Configuration for Tarteel Rise (Ad-Hoc Local Testing)
workflows:
  ios-direct-install:
    name: Tarteel Rise Direct iPhone Installer
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
    scripts:
      - name: Fetch Dependencies
        script: | 
          flutter pub get
      - name: Verify Audio Asset
        script: |
          mkdir -p assets/audio
          if [ ! -f assets/audio/adhan.mp3 ]; then
            echo "Mock Audio Track" > assets/audio/adhan.mp3
          fi
      - name: Build Ad-Hoc Application Bundle
        script: | 
          # Compiles a direct local execution package
          flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - your-email@example.com # Replace with your email address